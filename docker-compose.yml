services:
  api:
    build:
      context: ./apps/api
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      API_KEY: ${API_KEY}
      PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_KEY: ${API_KEY}
        API_PROXY_TARGET: http://api:4000
    ports:
      - "3000:3000"
    environment:
      # Points the Next.js rewrite proxy to the API container name
      API_PROXY_TARGET: http://api:4000
    depends_on:
      - api
    restart: unless-stopped
