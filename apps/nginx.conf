server {
    listen 80;
    server_name petersyoo.com www.petersyoo.com;

    # Everything — pages AND /api/v1/* — goes to the Next.js container.
    # Next.js rewrites /api/v1/* to the API container on the Docker network,
    # so nginx does not need to know the API port at all.
    location / {
        proxy_pass http://localhost:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js can take a moment on first request after a deploy
        proxy_read_timeout 60s;
    }
}

# After running: sudo certbot --nginx -d petersyoo.com -d www.petersyoo.com
# certbot will append the HTTPS server block and redirect rule automatically.
